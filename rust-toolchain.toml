# Pin the toolchain so local builds and CI use the exact same rustc, and so
# Swatinem/rust-cache never mixes object files from different compilers. Bump it
# deliberately, together with the `dtolnay/rust-toolchain@<version>` lines in
# .github/workflows/. Newer rustc stopped passing `--allow-undefined` to the
# wasm linker; .cargo/config.toml restores it for the web build.
[toolchain]
channel = "1.99.1"
targets = ["wasm32-unknown-unknown"]
