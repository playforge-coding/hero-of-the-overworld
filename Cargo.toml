[package]
name = "hero-of-the-overworld"
version = "0.1.0"
edition = "2024"
description = "A basic but extensible JRPG built with macroquad (native + web)."
license = "AGPL-3.0-only"

[lib]
crate-type = ["rlib"]

# Native binary. Named `hero` so tests can find it via CARGO_BIN_EXE_hero, and so
# the web build produces `hero.wasm`.
[[bin]]
name = "hero"
path = "src/main.rs"

[profile.release]
opt-level = 3

[profile.release.package."*"]
opt-level = 3

[dependencies]
# macroquad provides the window, GL rendering, input, and audio on both native
# and web (WebGL), so the game doesn't need its own wgpu/winit stack.
# `audio` is not in macroquad's default features, so enable it for music.
macroquad = { version = "0.4.16", features = ["audio"] }
glam = "0.34.3"
log = "0.4.35"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
# Embeds the whole `assets/data` content tree (per-entity RON files and CSV
# tilemaps) into the binary at compile time, so the split database ships inside
# the native binary and the wasm bundle with no runtime filesystem.
# `debug-embed` keeps debug builds embedded too, since the web build has no
# filesystem to read from.
rust-embed = { version = "8.14.0", features = ["debug-embed"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "7.0.0"
env_logger = "0.11.11"
gilrs = "0.11.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
sapp-jsutils = "0.1.7"

[dev-dependencies]
rustautogui = "2.5.0"
# Used by the e2e suite to load and analyze screenshots and generate templates.
image = { version = "0.25.10", default-features = false, features = ["png"] }
